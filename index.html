<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국내 주식 자동실행 프로그램 (로컬)</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Noto Sans KR", sans-serif; background: #f3f5f7; color: #1f2937; }
      .container { max-width: 1080px; margin: 20px auto; padding: 0 14px 24px; }
      .panel { background: #fff; border: 1px solid #d8e1e8; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
      h1 { margin: 0 0 8px; color: #0b4f71; font-size: 1.45rem; }
      h2 { margin: 0 0 10px; color: #0b4f71; font-size: 1.1rem; }
      .muted { color: #526070; margin: 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      label { display: block; margin-bottom: 4px; font-size: .84rem; color: #374151; }
      input, button, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px; }
      button { background: #0b4f71; color: #fff; font-weight: 700; cursor: pointer; }
      button.secondary { background: #475569; }
      button.danger { background: #b91c1c; }
      .row-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .status { margin-top: 8px; font-size: .9rem; color: #0f5132; }
      .warn { color: #9f1239; }
      table { width: 100%; border-collapse: collapse; font-size: .9rem; }
      th, td { border-bottom: 1px solid #e5ebf1; padding: 8px; text-align: right; }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:last-child, td:last-child { text-align: left; }
      th { background: #f8fbfd; color: #0b4f71; }
      .small { font-size: .82rem; color: #5b6878; }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <h1>국내 주식 자동실행 프로그램</h1>
        <p class="muted">종목/매수가/목표가/손절가/수량 규칙으로 자동 실행하며, 웹에서 모의/실투 모드를 전환할 수 있습니다.</p>
      </section>

      <section class="panel">
        <h2>로컬 서버 연결 + 모드 설정</h2>
        <div class="grid">
          <div><label for="apiBase">로컬 API 주소</label><input id="apiBase" value="http://127.0.0.1:9000" /></div>
          <div><label for="pollMs">가격 조회 주기(ms)</label><input id="pollMs" type="number" min="500" step="500" value="2000" /></div>
          <div><label for="tradeMode">거래 모드</label><select id="tradeMode"><option value="mock">모의투자</option><option value="live">실투자</option></select></div>
          <div style="align-self:end;"><button id="applyModeBtn" type="button">모드 적용</button></div>
          <div style="align-self:end;"><button id="healthBtn" type="button">연결 확인</button></div>
        </div>
        <p id="healthStatus" class="small">연결 확인 전</p>
      </section>

      <section class="panel">
        <h2>자동매매 규칙 추가</h2>
        <div class="grid">
          <div><label for="code">종목코드</label><input id="code" value="005930" /></div>
          <div style="align-self:end;"><button id="resolveBtn" type="button" class="secondary">종목 조회</button></div>
          <div><label for="buy">매수가(이하 도달 시 매수)</label><input id="buy" type="number" value="9000" /></div>
          <div><label for="tp">목표가(이상 도달 시 매도)</label><input id="tp" type="number" value="9900" /></div>
          <div><label for="sl">손절가(이하 도달 시 매도)</label><input id="sl" type="number" value="8700" /></div>
          <div><label for="qty">수량</label><input id="qty" type="number" min="1" step="1" value="10" /></div>
          <div style="align-self:end;"><button id="addRuleBtn" type="button">규칙 추가</button></div>
        </div>
      </section>

      <section class="panel">
        <h2>규칙 목록</h2>
        <div class="row-buttons">
          <button id="startBtn" type="button">모니터링 시작</button>
          <button id="stopBtn" class="secondary" type="button">모니터링 중지</button>
          <button id="clearBtn" class="danger" type="button">규칙 전체 삭제</button>
        </div>
        <p id="status" class="status">대기중</p>
        <table>
          <thead><tr><th>ID</th><th>종목코드</th><th>종목명</th><th>현재가</th><th>매수가</th><th>목표가</th><th>손절가</th><th>수량</th><th>예상매수금액</th><th>상태</th><th>최근실행</th></tr></thead>
          <tbody id="ruleBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>당일 수익 요약</h2>
        <div class="grid">
          <div><label for="reportDate">조회일</label><input id="reportDate" type="date" /></div>
          <div style="align-self:end;"><button id="reportBtn" type="button">수익 조회</button></div>
        </div>
        <p id="reportSummary" class="small">조회 전</p>
        <table>
          <thead><tr><th>종목</th><th>매수금액</th><th>매도금액</th><th>실현손익</th></tr></thead>
          <tbody id="pnlBody"></tbody>
        </table>
      </section>


      <section class="panel">
        <h2>보유 수량 확인</h2>
        <div class="grid">
          <div style="align-self:end;"><button id="positionsBtn" type="button">보유수량 조회</button></div>
        </div>
        <p id="positionsSummary" class="small">조회 전</p>
        <table>
          <thead><tr><th>종목코드</th><th>종목명</th><th>보유수량</th><th>평균단가</th><th>평가금액</th></tr></thead>
          <tbody id="positionsBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>실행 로그</h2>
        <table>
          <thead><tr><th>시각</th><th>종목</th><th>액션</th><th>가격</th><th>수량</th><th>결과</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
      </section>
    </main>

    <script>
      const state = { rules: [], logs: [], timer: null, nextId: 1 };
      const q = (id) => document.getElementById(id);
      const now = () => new Date().toLocaleTimeString("ko-KR", { hour12: false });
      const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
      q("reportDate").value = new Date().toISOString().slice(0, 10);

      function base() { return q("apiBase").value.trim().replace(/\/$/, ""); }

      async function getJson(url, options = {}) {
        const res = await fetch(url, options);
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try { const body = await res.json(); detail = `${detail} ${body.error || body.source || ""}`.trim(); } catch (_) {}
          throw new Error(detail);
        }
        return res.json();
      }

      async function resolveSymbol(code) {
        const c = (code || q("code").value).trim();
        if (!c) throw new Error("종목코드가 비어 있습니다.");
        return getJson(`${base()}/symbol/${encodeURIComponent(c)}`);
      }

      async function checkHealth() {
        try {
          const h = await getJson(`${base()}/health`);
          q("tradeMode").value = h.trade_mode || "mock";
          q("healthStatus").textContent = `연결 성공: mode=${h.trade_mode}, liveOrder=${h.live_order}`;
          q("healthStatus").classList.remove("warn");
        } catch (e) {
          q("healthStatus").textContent = `연결 실패: ${e.message}`;
          q("healthStatus").classList.add("warn");
        }
      }

      async function applyMode() {
        const mode = q("tradeMode").value;
        const r = await getJson(`${base()}/mode`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trade_mode: mode }) });
        q("status").textContent = `거래 모드 적용 완료: ${r.trade_mode}`;
      }

      async function addRule() {
        const code = q("code").value.trim();
        const buy = Number(q("buy").value);
        const tp = Number(q("tp").value);
        const sl = Number(q("sl").value);
        const qty = Number(q("qty").value);
        if (!code || qty <= 0 || buy <= 0 || tp <= 0 || sl <= 0) {
          q("status").textContent = "규칙 값이 올바르지 않습니다.";
          q("status").classList.add("warn");
          return;
        }
        if (!(tp > buy && buy > sl)) {
          q("status").textContent = "가격 조건 검증 실패: 목표가 > 매수가 > 손절가 여야 합니다.";
          q("status").classList.add("warn");
          return;
        }
        let name = code;
        try {
          const s = await resolveSymbol(code);
          name = s.name || code;
        } catch (_) {}

        const rule = { id: state.nextId++, code, name, buy, tp, sl, qty, status: "대기", current: 0, lastExec: "-", inPosition: false, expectedAmount: buy * qty };
        state.rules.push(rule);
        q("status").textContent = `규칙 ${rule.id} 추가 완료 (${name})`;
        q("status").classList.remove("warn");
        renderRules();
      }

      async function getCurrentPrice(code) {
        return getJson(`${base()}/quote/${encodeURIComponent(code)}`);
      }

      async function executeOrder(action, rule, price) {
        const result = await getJson(`${base()}/orders/execute`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: rule.code, side: action, qty: rule.qty, price }) });
        const qty = Number(result.executed_qty ?? rule.qty);
        const amount = Number(result.executed_amount ?? (price * qty));
        state.logs.unshift({ time: now(), code: rule.code, name: rule.name, action, price, qty, amount, result: `${result.status} / pos:${result.position_qty ?? "-"} / pnl:${fmt(result.realized_pnl)}` });
        state.logs = state.logs.slice(0, 100);
        renderLogs();
        await loadPositions();
      }

      async function tick() {
        for (const rule of state.rules) {
          if (rule.status.startsWith("완료")) continue;
          try {
            const quote = await getCurrentPrice(rule.code);
            const p = Number(quote.price || 0);
            rule.current = p;
            rule.name = quote.name || rule.name;
            if (quote.source === "last-good") {
              rule.status = `대기(last-good)`;
            }
            if (!rule.inPosition && p <= rule.buy) {
              await executeOrder("BUY", rule, p); rule.inPosition = true; rule.status = "매수완료(보유중)"; rule.lastExec = `${now()} BUY ${p}`;
            } else if (rule.inPosition && p >= rule.tp) {
              await executeOrder("SELL", rule, p); rule.inPosition = false; rule.status = "완료(목표가)"; rule.lastExec = `${now()} SELL(TP) ${p}`;
            } else if (rule.inPosition && p <= rule.sl) {
              await executeOrder("SELL", rule, p); rule.inPosition = false; rule.status = "완료(손절)"; rule.lastExec = `${now()} SELL(SL) ${p}`;
            }
          } catch (e) {
            rule.status = `오류(${e.message})`;
          }
        }
        renderRules();
      }

      function startMonitor() {
        stopMonitor();
        const ms = Math.max(500, Number(q("pollMs").value || 2000));
        state.timer = setInterval(tick, ms);
        q("status").textContent = `모니터링 시작 (${ms}ms)`;
        tick();
      }
      function stopMonitor() { if (state.timer) clearInterval(state.timer); state.timer = null; }
      function clearRules() { stopMonitor(); state.rules = []; renderRules(); }

      async function loadDailyReport() {
        const date = q("reportDate").value;
        const r = await getJson(`${base()}/reports/daily?date=${encodeURIComponent(date)}`);
        q("reportSummary").textContent = `${r.date} | 체결 ${r.count}건 | 실현손익 ${fmt(r.total_realized_pnl)}원`;
        const body = q("pnlBody");
        body.innerHTML = "";
        if (!r.by_code.length) {
          body.innerHTML = '<tr><td colspan="4">데이터 없음</td></tr>';
          return;
        }
        for (const row of r.by_code) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${row.code}</td><td>${fmt(row.buy_amount)}</td><td>${fmt(row.sell_amount)}</td><td>${fmt(row.realized_pnl)}</td>`;
          body.appendChild(tr);
        }
      }

      async function loadPositions() {
        try {
          const r = await getJson(`${base()}/positions`);
          q("positionsSummary").textContent = `보유 종목 ${r.count}건`;
          const body = q("positionsBody");
          body.innerHTML = "";
          if (!r.positions.length) {
            body.innerHTML = '<tr><td colspan="5">보유 수량 없음</td></tr>';
            return;
          }
          for (const row of r.positions) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${row.code}</td><td>${row.name || row.code}</td><td>${fmt(row.qty)}</td><td>${fmt(row.avg_price)}</td><td>${fmt(row.eval_amount)}</td>`;
            body.appendChild(tr);
          }
        } catch (e) {
          q("positionsSummary").textContent = `보유수량 조회 실패: ${e.message}`;
        }
      }

      function renderRules() {
        const body = q("ruleBody"); body.innerHTML = "";
        if (!state.rules.length) { body.innerHTML = '<tr><td colspan="11" class="warn">등록된 규칙이 없습니다.</td></tr>'; return; }
        for (const r of state.rules) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${r.id}</td><td>${r.code}</td><td>${r.name || r.code}</td><td>${r.current || "-"}</td><td>${fmt(r.buy)}</td><td>${fmt(r.tp)}</td><td>${fmt(r.sl)}</td><td>${fmt(r.qty)}</td><td>${fmt(r.expectedAmount)}</td><td>${r.status}</td><td>${r.lastExec}</td>`;
          body.appendChild(tr);
        }
      }
      function renderLogs() {
        const body = q("logBody"); body.innerHTML = "";
        if (!state.logs.length) { body.innerHTML = '<tr><td colspan="6">로그 없음</td></tr>'; return; }
        for (const log of state.logs) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${log.time}</td><td>${log.code} ${log.name || ""}</td><td>${log.action}</td><td>${fmt(log.price)}</td><td>${fmt(log.qty)} (금액 ${fmt(log.amount)})</td><td>${log.result}</td>`;
          body.appendChild(tr);
        }
      }

      q("healthBtn").addEventListener("click", checkHealth);
      q("applyModeBtn").addEventListener("click", () => applyMode().catch((e) => { q("status").textContent = `모드 적용 실패: ${e.message}`; q("status").classList.add("warn"); }));
      q("resolveBtn").addEventListener("click", async () => {
        try {
          const s = await resolveSymbol();
          q("status").textContent = `종목 조회 성공: ${s.code} / ${s.name}`;
          q("status").classList.remove("warn");
        } catch (e) {
          q("status").textContent = `종목 조회 실패: ${e.message}`;
          q("status").classList.add("warn");
        }
      });
      q("addRuleBtn").addEventListener("click", () => addRule().catch((e) => { q("status").textContent = `규칙 추가 실패: ${e.message}`; q("status").classList.add("warn"); }));
      q("startBtn").addEventListener("click", startMonitor);
      q("stopBtn").addEventListener("click", stopMonitor);
      q("clearBtn").addEventListener("click", clearRules);
      q("reportBtn").addEventListener("click", () => loadDailyReport().catch((e) => { q("reportSummary").textContent = `조회 실패: ${e.message}`; }));
      q("positionsBtn").addEventListener("click", () => loadPositions());

      renderRules(); renderLogs();
      checkHealth();
      loadDailyReport();
      loadPositions();
    </script>
  </body>
</html>
